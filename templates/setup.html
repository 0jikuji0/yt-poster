<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premier lancement — clipstudio</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='studio.css') }}">
</head>
<body>
<div id="flash">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}<div class="flash {{ category }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
</div>
<div class="auth">
  <div class="card">
    <div class="card-b">
      <div class="tb-logo" style="justify-content:center;margin-bottom:22px;">
        <span class="play"><i></i></span><b>clipstudio</b>
      </div>
      <h1>Premier lancement</h1>
      <p class="tiny muted" style="margin:0 0 20px;">Choisis un mot de passe pour protéger l'accès à l'interface.</p>
      <form method="post">
        <div class="field">
          <label>Mot de passe (6 caractères minimum)</label>
          <input class="inp" type="password" name="password" autofocus required minlength="6">
        </div>
        <button class="btn primary" style="margin-top:18px;width:100%;justify-content:center;">Créer</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
